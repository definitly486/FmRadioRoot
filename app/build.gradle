plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.fmradio'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.fmradio.rootfm'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // только для компиляции: на устройстве используются настоящие классы фреймворка
    compileOnly project(':radio-stubs')
}
