// Заглушки скрытых классов android.hardware.radio.* — нужны ТОЛЬКО для компиляции.
// В APK они не попадают (в :app подключены как compileOnly), на устройстве
// используются настоящие классы из фреймворка.
plugins {
    id 'com.android.library'
}

android {
    namespace 'stubs.radio'
    compileSdk 34
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
